<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chọn ảnh bao bì mới</title>
<meta name="description" content="Chọn 1 ảnh bao bì mới nhất, nhân viên sẽ gửi ảnh cho bạn.">
<meta name="theme-color" content="#0b2a5b">
<style>
  :root { --navy: #0b2a5b; --vang: #e8a317; --nen: #f3f6fb; --chu: #0f2447; --mo: #5b6b85; --vien: #dbe3ef; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--nen); color: var(--chu); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--navy); color: #fff; padding: 22px 16px 18px; }
  header h1 { margin: 0 0 4px; font-size: 21px; }
  header p { margin: 0; opacity: .85; font-size: 14px; }
  main { max-width: 960px; margin: 0 auto; padding: 14px 12px 40px; }
  .trangthai { color: var(--mo); font-size: 14px; margin: 4px 4px 12px; }
  .luoi { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .the { background: #fff; border: 1px solid var(--vien); border-radius: 12px; overflow: hidden; padding: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .the:focus-visible { outline: 3px solid var(--vang); }
  .the img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #e9eef6; }
  .the span { display: block; padding: 8px 10px; font-size: 14px; font-weight: 600; }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, 94vw); max-height: 94vh; }
  dialog::backdrop { background: rgba(11, 42, 91, .55); }
  .hop { padding: 16px; }
  .hop img { display: block; width: 100%; max-height: 55vh; object-fit: contain; background: #e9eef6; border-radius: 10px; }
  .hop h2 { font-size: 18px; margin: 12px 0 8px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 10px 0 4px; }
  input { width: 100%; padding: 12px; font: inherit; border: 1px solid var(--vien); border-radius: 10px; }
  input:focus { outline: 2px solid var(--navy); border-color: transparent; }
  .nut { display: block; width: 100%; padding: 13px; margin-top: 12px; border: 0; border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer; }
  .chinh { background: var(--vang); color: #241600; }
  .phu { background: #e9eef6; color: var(--navy); }
  .nut:disabled { opacity: .6; cursor: wait; }
  .loi { color: #b42318; font-size: 14px; margin: 8px 0 0; min-height: 1em; }
  .ghichu { color: var(--mo); font-size: 13px; margin: 8px 0 0; }
  .xong { background: #fff; border: 1px solid var(--vien); border-radius: 14px; padding: 22px 16px; text-align: center; }
  .xong img { width: 200px; max-width: 70%; border-radius: 10px; }
  [hidden] { display: none !important; }

  /* ===== Điện thoại ===== */
  html { -webkit-text-size-adjust: 100%; }
  button, .the { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  header { padding-top: max(22px, env(safe-area-inset-top)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
  main { padding-bottom: max(40px, env(safe-area-inset-bottom)); }
  body:has(dialog[open]) { overflow: hidden; }
  dialog { max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain; }
  .dongHop { position: sticky; top: 0; z-index: 1; float: right; width: 40px; height: 40px; margin: -6px -6px 0 0; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--navy); font-size: 22px; line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(11,42,91,.15); }
  @media (max-width: 560px) {
    .luoi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    main { padding-left: 10px; padding-right: 10px; }
    header h1 { font-size: 20px; }
    /* Hộp chọn thành tấm trượt từ đáy màn hình lên */
    dialog { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 18px 18px 0 0; max-height: 92dvh; }
    dialog[open] { animation: truotLen .38s cubic-bezier(.2,1,.3,1); }
    .hop { padding: 14px 14px max(16px, env(safe-area-inset-bottom)); }
    .hop::before { content: ""; display: block; width: 40px; height: 4px; margin: -4px auto 10px; border-radius: 2px; background: var(--vien); }
    .hop img { max-height: 42dvh; }
  }
  @keyframes truotLen { from { transform: translateY(100%); } }
  @media (max-width: 340px) { .the span { font-size: 13px; padding: 6px 8px; } }

  /* ===== Hiệu ứng động ===== */
  header { position: relative; overflow: hidden; background: linear-gradient(120deg, #0b2a5b, #1a4a8f, #0b2a5b); background-size: 200% 100%; animation: troi 9s ease-in-out infinite; }
  header::after { content: ""; position: absolute; inset: 0; background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.16) 50%, transparent 60%); transform: translateX(-100%); animation: loe 5s ease-in-out 1s infinite; pointer-events: none; }
  header h1 { animation: len .6s ease-out both; }
  header p { animation: len .6s ease-out .12s both; }
  @keyframes troi { 50% { background-position: 100% 0; } }
  @keyframes loe { 55%, 100% { transform: translateX(100%); } }
  @keyframes len { from { opacity: 0; transform: translateY(14px); } }
  .dem { display: inline-block; font-weight: 700; color: var(--navy); }
  .dem.nhay { animation: nay .5s; }
  @keyframes nay { 40% { transform: scale(1.4); color: var(--vang); } }

  .the { box-shadow: 0 1px 2px rgba(11,42,91,.06); transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s; }
  .luoi.dau .the { animation: len .5s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 55ms); }
  .the .khung { display: block; overflow: hidden; padding: 0; }
  .the img { opacity: 0; transition: transform .5s ease, opacity .5s; }
  .the img.co { opacity: 1; }
  @media (hover: hover) {
    .the:hover { transform: translateY(-4px); box-shadow: 0 14px 26px rgba(11,42,91,.18); }
    .the:hover img { transform: scale(1.07); }
  }
  .the:active { transform: scale(.96); }
  .the.mat { animation: mat .5s ease-in forwards; pointer-events: none; }
  @keyframes mat { to { opacity: 0; transform: scale(.6) rotate(-5deg); filter: blur(4px); } }
  .sk { aspect-ratio: 1 / 1.2; border-radius: 12px; background: linear-gradient(90deg, #e3e9f3 25%, #f5f8fc 50%, #e3e9f3 75%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }

  dialog[open] { animation: bat .38s cubic-bezier(.2,1.25,.3,1); }
  dialog[open]::backdrop { animation: hien .3s ease; backdrop-filter: blur(4px); }
  @keyframes bat { from { opacity: 0; transform: translateY(40px) scale(.94); } }
  @keyframes hien { from { opacity: 0; } }
  .hop img { animation: hien .5s ease; }
  input { transition: box-shadow .2s, border-color .2s; }
  input:focus { box-shadow: 0 0 0 4px rgba(11,42,91,.12); }
  .nut { transition: transform .15s, filter .2s; }
  .nut:active { transform: scale(.97); }
  .chinh { background: linear-gradient(90deg, #e8a317, #f7c94f, #e8a317); background-size: 200% 100%; animation: troi 3s ease-in-out infinite; box-shadow: 0 6px 16px rgba(232,163,23,.35); }
  .chinh:disabled { animation: troi .8s linear infinite; }
  .loi:not(:empty) { animation: rung .35s; }
  @keyframes rung { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .xong { position: relative; overflow: hidden; animation: bat .55s cubic-bezier(.2,1.25,.3,1) both; }
  .xong h2 { animation: len .5s ease-out .5s both; }
  .xong p { animation: len .5s ease-out .65s both; }
  .xong img { margin-top: 10px; animation: len .6s ease-out .8s both; }
  .tick { width: 76px; height: 76px; display: block; margin: 0 auto 4px; }
  .tick circle { stroke-dasharray: 190; stroke-dashoffset: 190; animation: veNet .6s ease-out .1s forwards; }
  .tick path { stroke-dasharray: 50; stroke-dashoffset: 50; animation: veNet .35s ease-out .6s forwards; }
  @keyframes veNet { to { stroke-dashoffset: 0; } }
  .hoa { position: absolute; top: -12px; width: 8px; height: 13px; border-radius: 2px; animation: roi 2s ease-in var(--d) forwards; }
  @keyframes roi { to { transform: translate(var(--x), 420px) rotate(600deg); opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .the img { opacity: 1; }
  }
</style>
</head>
<body>
<header>
  <h1>Chọn ảnh bao bì mới</h1>
  <p>Mỗi người chọn 1 ảnh. Ảnh đã có người chọn sẽ không còn hiện cho người khác.</p>
</header>
<main>
  <div id="xong" class="xong" hidden></div>
  <div id="khuChon">
    <p id="trangThai" class="trangthai">Đang tải ảnh…</p>
    <div id="luoi" class="luoi"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </div>
</main>

<dialog id="hop">
  <div class="hop">
    <button class="dongHop" type="button" aria-label="Đóng" autofocus onclick="hop.close()">×</button>
    <img id="hopAnh" alt="">
    <h2 id="hopTen"></h2>
    <form id="form" novalidate>
      <label for="ten">Họ tên</label>
      <input id="ten" autocomplete="name" maxlength="60" required>
      <label for="sdt">Số điện thoại (để nhân viên gửi ảnh)</label>
      <input id="sdt" type="tel" inputmode="tel" autocomplete="tel" maxlength="15" required>
      <p id="loi" class="loi" role="alert"></p>
      <button id="nutXacNhan" class="nut chinh" type="submit">Xác nhận chọn ảnh này</button>
      <button class="nut phu" type="button" onclick="hop.close()">Xem ảnh khác</button>
      <p class="ghichu">Bấm xác nhận là ảnh được giữ cho bạn. Mỗi số điện thoại chỉ chọn được 1 ảnh.</p>
    </form>
  </div>
</dialog>

<script>
// SUA: link .../exec của Apps Script. Chạy trên máy (localhost) thì tự dùng máy chủ thử.
var API = 'https://script.google.com/macros/s/AKfycbxqCfqMUHu_BI2xMPiW46-1YBoY7ga8oHRkWrw3cVSthPPM9OMq_cCzYvCghejLpfnLrA/exec';
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) API = location.origin + '/exec';

var $ = function (id) { return document.getElementById(id); };
var hop = $('hop'), DS = [], DANG = null;
// Chạm ra vùng tối ngoài hộp thì đóng hộp.
hop.addEventListener('click', function (e) { if (e.target === hop) hop.close(); });

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }

var LAN_DAU = true, CHO_VE = 0;

// Ảnh vừa bị người khác chọn: cho thẻ đó mờ dần rồi mới vẽ lại lưới.
function ve(ds) {
  var con = {}; ds.forEach(function (a) { con[a.id] = 1; });
  var mat = LAN_DAU ? [] : DS.filter(function (a) { return !con[a.id]; });
  mat.forEach(function (a) { var el = document.querySelector('.the[data-id="' + a.id + '"]'); if (el) el.classList.add('mat'); });
  clearTimeout(CHO_VE);
  CHO_VE = setTimeout(function () { veNgay(ds); }, mat.length ? 480 : 0);
}

function veNgay(ds) {
  var doiSo = DS.length !== ds.length && !LAN_DAU;
  DS = ds;
  $('trangThai').innerHTML = ds.length ? 'Còn <span class="dem' + (doiSo ? ' nhay' : '') + '">' + ds.length + '</span> ảnh. Bấm vào ảnh để xem lớn và chọn.' : 'Hiện chưa còn ảnh nào để chọn. Bạn quay lại sau nhé.';
  $('luoi').className = 'luoi' + (LAN_DAU ? ' dau' : '');
  $('luoi').innerHTML = ds.map(function (a, i) {
    return '<button class="the" type="button" data-id="' + esc(a.id) + '" style="--i:' + i + '" onclick="mo(' + i + ')"><span class="khung"><img loading="lazy" onload="this.classList.add(\'co\')" src="' + esc(a.url) + '" alt="' + esc(a.ten) + '"></span><span>' + esc(a.ten) + '</span></button>';
  }).join('');
  LAN_DAU = false;
  if (DANG && !ds.some(function (a) { return a.id === DANG.id; }) && hop.open) {
    hop.close();
    alert('Ảnh "' + DANG.ten + '" vừa có người chọn trước. Bạn chọn ảnh khác nhé.');
  }
}

function tai() {
  return fetch(API).then(function (r) { return r.json(); }).then(function (kq) {
    if (kq.ok) ve(kq.anh);
  }).catch(function () {
    if (!DS.length) $('trangThai').textContent = 'Không tải được ảnh. Kiểm tra mạng rồi tải lại trang.';
  });
}

function mo(i) {
  DANG = DS[i];
  $('hopAnh').src = DANG.lon || DANG.url; $('hopAnh').alt = DANG.ten;
  $('hopTen').textContent = DANG.ten;
  $('loi').textContent = '';
  hop.showModal();
}

function daXong(ten, sdt, url) {
  $('khuChon').hidden = true;
  $('xong').hidden = false;
  var mau = ['#e8a317', '#0b2a5b', '#2bb673', '#e5484d', '#4c8dff', '#f7c94f'], hoa = '';
  for (var i = 0; i < 28; i++) hoa += '<i class="hoa" style="left:' + (Math.random() * 100) + '%;background:' + mau[i % mau.length] + ';--x:' + Math.round(Math.random() * 120 - 60) + 'px;--d:' + (Math.random() * .5).toFixed(2) + 's"></i>';
  $('xong').innerHTML = hoa +
    '<svg class="tick" viewBox="0 0 66 66" fill="none" stroke="#2bb673" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><circle cx="33" cy="33" r="29"/><path d="M20 34l9 9 17-19"/></svg>' +
    '<h2>Đã giữ ảnh "' + esc(ten) + '" cho bạn</h2><p>Nhân viên sẽ gửi ảnh qua số <b>' + esc(sdt) + '</b>.</p>' +
    (url ? '<img src="' + esc(url) + '" alt="' + esc(ten) + '">' : '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$('form').onsubmit = function (e) {
  e.preventDefault();
  var ten = $('ten').value.trim(), sdt = $('sdt').value.trim(), nut = $('nutXacNhan');
  if (ten.length < 2) { $('loi').textContent = 'Vui lòng nhập họ tên.'; return; }
  if (sdt.replace(/\D/g, '').length < 9) { $('loi').textContent = 'Vui lòng nhập số điện thoại.'; return; }
  nut.disabled = true; nut.textContent = 'Đang gửi…'; $('loi').textContent = '';
  // text/plain để trình duyệt không hỏi trước (CORS), Apps Script vẫn đọc được.
  fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ id: DANG.id, ten: ten, sdt: sdt }) })
    .then(function (r) { return r.json(); })
    .then(function (kq) {
      if (kq.ok) {
        localStorage.setItem('daChon', JSON.stringify({ ten: kq.ten, sdt: sdt }));
        hop.close(); daXong(kq.ten, sdt, DANG.url); return;
      }
      $('loi').textContent = kq.loi || 'Chưa gửi được, thử lại nhé.';
      if (kq.het) { DANG = null; hop.close(); ve(kq.anh || DS); alert(kq.loi); }
    })
    .catch(function () { $('loi').textContent = 'Mất kết nối, bấm xác nhận lại nhé.'; })
    .then(function () { nut.disabled = false; nut.textContent = 'Xác nhận chọn ảnh này'; });
};

var cu = JSON.parse(localStorage.getItem('daChon') || 'null');
if (cu) daXong(cu.ten, cu.sdt);
else if (/DAN_LINK/.test(API)) $('trangThai').textContent = 'Trang chưa được nối với thư viện ảnh.';
else { tai(); setInterval(function () { if (!document.hidden) tai(); }, 20000); }
</script>
</body>
</html>
